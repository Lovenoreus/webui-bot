services:
  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}

  open-webui-ticket:
    build:
      context: .
      args:
        OLLAMA_BASE_URL: '/ollama'
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui-ticket
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    ports:
      - ${OPEN_WEBUI_PORT-3101}:8080
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY='
      - 'MCP_SERVER_PORT=${MCP_SERVER_PORT:-8009}'
      - 'MCP_TOOLS_LIST=${MCP_TOOLS_LIST:-greet:greet,ad:active_directory,ticket:ticket_system,weather:weather}'
      - 'MCP_RESPONSE_CACHE_TTL=${MCP_RESPONSE_CACHE_TTL:-60}'  # Cache TTL in seconds
      - 'MCP_RESPONSE_CACHE_SIZE=${MCP_RESPONSE_CACHE_SIZE:-500}'  # Max cached responses
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  ollama: {}
  open-webui: {}